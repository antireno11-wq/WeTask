name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck / Lint / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci?schema=public"
      SESSION_SECRET: "ci-placeholder-session-secret-32-bytes-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      APP_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Next build
        run: npm run build

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Solo en push a main — PRs sin secrets de staging usarían credenciales vacías
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks

    env:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-placeholder-session-secret-32-bytes-min' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
      APP_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
      SEED_DEMO_DATA: "true"
      PRIMARY_ADMIN_EMAIL: ${{ secrets.PRIMARY_ADMIN_EMAIL }}
      PRIMARY_ADMIN_PASSWORD: ${{ secrets.PRIMARY_ADMIN_PASSWORD }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASS: ${{ secrets.E2E_CUSTOMER_PASS }}
      E2E_PRO_EMAIL: ${{ secrets.E2E_PRO_EMAIL }}
      E2E_PRO_PASS: ${{ secrets.E2E_PRO_PASS }}
      E2E_ADMIN_EMAIL: ${{ secrets.PRIMARY_ADMIN_EMAIL }}
      E2E_ADMIN_PASS: ${{ secrets.PRIMARY_ADMIN_PASSWORD }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma generate
        run: npx prisma generate

      - name: Build (solo si no hay URL de staging externa)
        if: env.PLAYWRIGHT_BASE_URL == 'http://localhost:3000'
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          NODE_ENV: production
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
