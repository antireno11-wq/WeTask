name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck / Lint / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholders. Fase 0 exige SESSION_SECRET en prod;
      # acá lo seteamos solo para que `next build` no aborte en CI.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci?schema=public"
      SESSION_SECRET: "ci-placeholder-session-secret-32-bytes-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      APP_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Next build
        run: npm run build
